packages:
  - "packages/*"

trustPolicy: any

# Native postinstall scripts. pnpm 11 fails CI with ERR_PNPM_IGNORED_BUILDS
# unless these are allowed. esbuild/workerd ship Worker binaries; vgpu pulls
# @vgpu/adapter-node and webgpu for the status-page globe.
allowBuilds:
  esbuild: true
  workerd: true
  "@vgpu/adapter-node": true
  webgpu: true
