# Deploy from main / manual dispatch.
#
# Secret (Settings → Secrets and variables → Actions → Secrets):
#   CLOUDFLARE_API_TOKEN
#
# Variables (same page → Variables), or secrets with the same names:
#   CLOUDFLARE_ACCOUNT_ID
#   FOXWATCH_D1_DATABASE_ID      optional pin for foxwatch-data
#   FOXWATCH_KV_NAMESPACE_ID     optional pin for foxwatch-status
name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check-types

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: foxwatch-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      FOXWATCH_D1_DATABASE_ID: ${{ vars.FOXWATCH_D1_DATABASE_ID || secrets.FOXWATCH_D1_DATABASE_ID }}
      FOXWATCH_KV_NAMESPACE_ID: ${{ vars.FOXWATCH_KV_NAMESPACE_ID || secrets.FOXWATCH_KV_NAMESPACE_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: auth
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=true" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "::error::Set secret CLOUDFLARE_API_TOKEN and variable CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          echo "::notice::Skipping deploy because Cloudflare credentials are not configured (expected for a fresh template clone)."
      - if: steps.auth.outputs.skip != 'true'
        uses: actions/checkout@v4
      - if: steps.auth.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
      - if: steps.auth.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        if: steps.auth.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - name: Create or reuse D1 / KV / Queue
        if: steps.auth.outputs.skip != 'true' && (env.FOXWATCH_D1_DATABASE_ID == '' || env.FOXWATCH_KV_NAMESPACE_ID == '')
        run: pnpm foxwatch init --yes
      - name: Deploy Worker
        if: steps.auth.outputs.skip != 'true'
        run: pnpm deploy
